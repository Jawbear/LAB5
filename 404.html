<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — ScholarTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #020617 50%, #1a1040 100%);
            color: #fff;
        }
        .container { text-align: center; animation: fadeIn 0.6s ease; }
        h1 { font-size: 6rem; font-weight: 800; color: #6366f1; letter-spacing: -0.04em; }
        p { color: #94a3b8; margin-top: 12px; font-size: 1.125rem; }
        a {
            display: inline-block; margin-top: 28px; padding: 12px 28px;
            background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff;
            text-decoration: none; border-radius: 10px; font-weight: 600;
            transition: transform 150ms, box-shadow 150ms;
        }
        a:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99,102,241,0.4); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Page not found. Let's get you back on track.</p>
        <a href="index.html">← Back to Dashboard</a>
    </div>
</body>
</html>
