<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — ScholarTrack</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(2, 6, 23, 0.90) 50%, rgba(26, 16, 64, 0.88) 100%),
                        url('images/bg-login.jpg') center center / cover no-repeat fixed;
            color: #fff;
            padding: 20px;
        }
        .container {
            text-align: center;
            animation: fadeIn 0.6s ease;
            max-width: 480px;
            width: 100%;
            padding: 48px 36px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
        }
        .error-logo {
            width: 76px;
            height: 76px;
            object-fit: contain;
            background: #ffffff;
            border-radius: 18px;
            padding: 6px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        h1 { font-size: 5rem; font-weight: 800; color: #818cf8; letter-spacing: -0.04em; line-height: 1; }
        p.subtitle { color: #e2e8f0; margin-top: 12px; font-size: 1.125rem; font-weight: 600; }
        p.desc { color: #94a3b8; margin-top: 6px; font-size: 0.875rem; }
        a {
            display: inline-block; margin-top: 28px; padding: 12px 28px;
            background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff;
            text-decoration: none; border-radius: 12px; font-weight: 600;
            transition: transform 150ms, box-shadow 150ms;
        }
        a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/logo.png" alt="ADSSU Logo" class="error-logo">
        <h1>404</h1>
        <p class="subtitle">Page Not Found</p>
        <p class="desc">The requested resource could not be found or has moved.</p>
        <a href="index.html">← Return to ScholarTrack</a>
    </div>
</body>
</html>
